<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Verify a DNOODLES ledger record</title>
<!--
  INDEPENDENT VERIFIER.

  This page is deliberately dependency-free and deliberately hosted OUTSIDE DNOODLES infrastructure. It loads no
  scripts, no fonts, no styles from anywhere. It talks to no DNOODLES server. All hashing happens in your browser
  via WebCrypto, and the Merkle root it compares against is fetched from this public repository — the same
  repository whose commit history anyone can inspect.

  That is the entire point. A verification performed by the company that wrote the record proves nothing. This one
  works with every DNOODLES server switched off.

  The rules below are the frozen v1 format (see SPEC.md):
    data_hash  = sha256(canonicalJson)                                              -- the exact bytes hashed
    block_hash = sha256(data_hash + previous_hash + block_number + chain_code)      -- ASCII concatenation
    leaf       = sha256(0x00 || raw32(block_hash))                                  -- RFC 6962 domain separation
    node       = sha256(0x01 || left || right)                                      -- odd node promoted, NEVER duplicated

  i18n is client-side only (EN/AR dictionary below) — there is no server to render a locale from. Hex hashes,
  timestamps and other technical values stay dir="ltr" even in RTL mode; bidi-reordering a hash makes it unreadable
  and un-copyable.
-->
<style>
  :root{--p:#F36E37;--bg:#f8f9fa;--card:#fff;--tx:#2d3436;--tx2:#636e72;--bd:#e9ecef;
        --ok:#27ae60;--bad:#e74c3c;--warn:#FFA000}
  @media (prefers-color-scheme:dark){
    :root{--bg:#1a1d21;--card:#252a30;--tx:#e0e0e0;--tx2:#a0a0a0;--bd:#3a3f47}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,-apple-system,Segoe UI,Arial,sans-serif}
  .wrap{max-width:860px;margin:0 auto;padding:28px 20px 60px}
  header{background:linear-gradient(135deg,#F36E37,#d1511a);color:#fff;border-radius:14px;padding:24px 26px;margin-bottom:22px;
         position:relative}
  header h1{margin:0 0 6px;font-size:24px}
  header p{margin:0;opacity:.93;font-size:14.5px;max-width:640px}
  .langToggle{position:absolute;top:20px;inset-inline-end:22px;display:flex;background:rgba(255,255,255,.18);
              border-radius:8px;padding:3px;gap:2px}
  .langToggle button{background:transparent;color:#fff;opacity:.75;border-radius:6px;padding:6px 12px;
                      font-size:13px;font-weight:600;box-shadow:none}
  .langToggle button.active{background:#fff;color:#d1511a;opacity:1}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:16px}
  h2{font-size:16px;margin:0 0 10px}
  textarea{width:100%;min-height:150px;font:12.5px/1.5 ui-monospace,Consolas,monospace;padding:10px;
           border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);resize:vertical;
           direction:ltr;text-align:left}
  button{background:var(--p);color:#fff;border:0;border-radius:8px;padding:11px 20px;font-size:15px;
         font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  input[type=file]{margin-bottom:10px;font-size:13px}
  .step{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--bd);align-items:flex-start}
  .step:last-child{border-bottom:0}
  .mark{flex:0 0 24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;
        font-size:14px;font-weight:700;color:#fff;background:var(--tx2)}
  .ok .mark{background:var(--ok)} .bad .mark{background:var(--bad)} .warn .mark{background:var(--warn)}
  .step .t{font-weight:600;font-size:14px}
  .step .d{font-size:12.5px;color:var(--tx2);word-break:break-all;direction:ltr;text-align:left}
  .verdict{border-radius:12px;padding:18px;margin-bottom:16px;font-weight:600;display:none}
  .verdict.ok{display:block;background:rgba(39,174,96,.12);border:1px solid var(--ok);color:var(--ok)}
  .verdict.bad{display:block;background:rgba(231,76,60,.10);border:1px solid var(--bad);color:var(--bad)}
  .verdict small{display:block;font-weight:400;color:var(--tx);margin-top:6px;font-size:13px}
  .issuerLine{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--bd);
              font-size:14px}
  .issuerLine .mark{background:var(--ok)}
  code{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;background:rgba(243,110,55,.10);
       padding:1px 5px;border-radius:4px;direction:ltr;unicode-bidi:embed}
  .note{font-size:13px;color:var(--tx2);margin-top:14px}
  .kv{display:grid;grid-template-columns:minmax(160px,220px) 1fr;gap:8px 12px;margin-top:8px}
  .kv .k{font-weight:600;color:var(--tx2)}
  .kv .v{word-break:break-word}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="langToggle" id="langToggle">
    <button type="button" data-lang="en">EN</button>
    <button type="button" data-lang="ar">عربي</button>
  </div>
  <h1 data-i18n="title"></h1>
  <p data-i18n="intro"></p>
</header>

<div class="card">
  <h2 data-i18n="step1Title"></h2>
  <input type="file" id="file" accept="application/json"/>
  <textarea id="bundle" data-i18n-placeholder="pasteHint"></textarea>
  <p style="margin:12px 0 0"><button id="go" data-i18n="verifyBtn"></button></p>
</div>

<div id="verdict" class="verdict"></div>

<div id="issuerCard" class="card" style="display:none">
  <div class="issuerLine"><div class="mark">✓</div><div><span data-i18n="issuedByLabel"></span> <strong id="issuerName"></strong></div></div>
</div>

<div class="card" id="results" style="display:none">
  <h2 data-i18n="step2Title"></h2>
  <div id="steps"></div>
  <p class="note" data-i18n="step2Note"></p>
</div>

<div class="card" id="displayRowsCard" style="display:none">
  <h2 data-i18n="step3Title"></h2>
  <div id="displayRows"></div>
  <p class="note" data-i18n="step3Note"></p>
</div>

<script>
// ─── i18n ──────────────────────────────────────────────────────────────────
const I18N = {

  ar: {
    title: 'التحقق من سجل في السجل الموثّق',

    verifyBtn: 'تحقّق',
    step2Title: '٢. ما الذي تم التحقق منه',
    step2Note: 'الفحوصات ١–٣ عمليات حسابية بحتة تجري على جهازك. الفحص ٤ يجلب الجذر المنشور من هذا المستودع — وهي الخطوة الوحيدة التي تتصل بالشبكة، وتتصل بـ GitHub وليس بـ DNOODLES. إذا كان الفحص ٤ محجوبًا (لا يوجد اتصال، أو نُقل الملف)، يمكنك مقارنة الجذر المحسوب أدناه يدويًا مع ملف الجذر في هذا المستودع، ومع سجل تغييراته (commit history).',

    issuedByLabel: 'صادر من',

    stepDataTitle: 'محتوى السجل يطابق بصمته المسجّلة',
    stepBlockTitle: 'الكتلة سليمة ومرتبطة بسلسلتها وموضعها',
    stepRootTitle: 'سجلك موجود داخل الجذر اليومي المنشور',
    stepAnchorMissingTitle: 'لا يوجد ملف جذر منشور للمقارنة',
    stepAnchorMissingDetail: 'لا تحمل هذه الحزمة rootFileUrl — قد يكون الجذر لم يُنشر بعد. إلى أن يُنشر، هذا السجل غير قابل للتحقق المستقل.',
    stepAnchorOkTitle: 'الجذر يطابق الجذر المنشور علنًا، قبل وقوع أي نزاع',

    stepAnchorFailDetailPrefix: 'قارن يدويًا: يجب أن يساوي الجذر المحسوب أعلاه قيمة "merkleRoot" في',
    stepAnchorFailDetailSuffix: '— ويجب أن يكون ذلك الملف موجودًا في سجل تغييرات المستودع. الخطأ:',
  },
};

let lang = 'en';
const t = (key) => I18N[lang][key] ?? I18N.en[key] ?? key;

function applyStaticI18n() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
  document.querySelectorAll('#langToggle button').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
}

// ─── primitives ──────────────────────────────────────────────────────────────
const enc = new TextEncoder();

async function sha256Hex(bytes) {
  const digest = await crypto.subtle.digest('SHA-256', bytes);
  return [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2, '0')).join('');
}
const sha256Text = (text) => sha256Hex(enc.encode(text));

function hexToBytes(hex) {
  if (!/^[0-9a-f]{64}$/i.test(hex)) throw new Error('Not a 32-byte hex hash: ' + hex);
  const out = new Uint8Array(32);
  for (let i = 0; i < 32; i++) out[i] = parseInt(hex.substr(i * 2, 2), 16);
  return out;
}
function concat(...arrays) {
  const total = arrays.reduce((n, a) => n + a.length, 0);
  const out = new Uint8Array(total);
  let at = 0;
  for (const a of arrays) { out.set(a, at); at += a.length; }
  return out;
}

// RFC 6962. The 0x00 / 0x01 prefixes are not decoration: without them a leaf hash could be passed off as an
// internal node. And an odd node is PROMOTED, never duplicated — duplicating it (as Bitcoin does) would let two
// different sets of records produce the same root.
const leafHash = (blockHashHex) => sha256Hex(concat(new Uint8Array([0x00]), hexToBytes(blockHashHex)));
const nodeHash = (l, r) => sha256Hex(concat(new Uint8Array([0x01]), hexToBytes(l), hexToBytes(r)));

// ─── verification ────────────────────────────────────────────────────────────

// A proof bundle is not the record. People naturally paste the record content they can see — it is the part that
// looks meaningful to a human. Without this check they get "could not verify", which reads as "your record is
// suspect" when the truth is "right data, wrong file". Never let a tooling mistake look like a failed proof.
function describeIfNotABundle(b) {
  if (b && typeof b === 'object' && !Array.isArray(b) && b.data && !b.canonicalJson) {
    return t('notBundleIsRecord');
  }
  const missing = ['canonicalJson', 'dataHash', 'blockHash', 'merkleRoot']
      .filter(f => !b || typeof b[f] !== 'string');
  if (missing.length) {
    return t('notBundleMissing').replace('{fields}', missing.join(', '));
  }
  return null;
}

// Step titles are translation keys, not literal strings, so a language switch after verifying can re-render the
// same computed result without re-hashing anything.
async function verify(b) {
  const steps = [];

  // 1. Do the record's own bytes hash to the recorded data hash?
  const dataHash = await sha256Text(b.canonicalJson);
  steps.push({
    ok: dataHash === b.dataHash,
    titleKey: 'stepDataTitle',
    detail: 'sha256(canonicalJson) = ' + dataHash,
    human: b.canonicalJson
  });

  // 2. Is the block itself well-formed, and bound to this chain and position?
  //
  // Note we feed the RECOMPUTED dataHash forward, not the one the bundle claims — and likewise the recomputed
  // blockHash into step 3. Verifying each step against the bundle's own claimed values would still catch tampering
  // overall (the root is the anchor), but it would show a forged record passing steps 2–4 with green ticks, which
  // reads as "mostly fine". Chaining the computed values means one edit anywhere fails everything downstream, and
  // the display tells the truth.
  const blockHash = await sha256Text(dataHash + b.previousHash + b.blockNumber + b.chainCode);
  steps.push({
    ok: blockHash === b.blockHash,
    titleKey: 'stepBlockTitle',
    detail: 'sha256(dataHash + previousHash + ' + b.blockNumber + ' + ' + b.chainCode + ') = ' + blockHash
  });

  // 3. Walk the Merkle path up to the root.
  let acc = await leafHash(blockHash);
  for (const step of (b.merklePath || [])) {
    acc = step.position === 'LEFT' ? await nodeHash(step.hash, acc) : await nodeHash(acc, step.hash);
  }
  steps.push({
    ok: acc === b.merkleRoot,
    titleKey: 'stepRootTitle',
    detail: 'computed root = ' + acc + ' (' + (b.merklePath || []).length + ' sibling hashes)'
  });

  // 4. Is that root the one actually published — in the public repo, not on a DNOODLES server?
  const anchor = (b.anchors || []).find(a => a.rootFileUrl);
  if (!anchor) {
    steps.push({ warn: true, titleKey: 'stepAnchorMissingTitle', detail: t('stepAnchorMissingDetail') });
  } else {
    try {
      const res = await fetch(anchor.rootFileUrl, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const published = await res.json();
      steps.push({
        ok: published.merkleRoot === acc && acc === b.merkleRoot,
        titleKey: 'stepAnchorOkTitle',
        detail: 'published root = ' + published.merkleRoot + '  ·  ' + anchor.rootFileUrl +
                (anchor.commitSha ? '  ·  commit ' + anchor.commitSha.substring(0, 10) : '')
      });
    } catch (e) {
      steps.push({
        warn: true,
        titleKey: 'stepAnchorFailTitle',
        detail: t('stepAnchorFailDetailPrefix') + ' ' + anchor.rootFileUrl + ' ' +
                t('stepAnchorFailDetailSuffix') + ' ' + e.message
      });
    }
  }
  return steps;
}

// ─── ui ──────────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);

// Last computed result, kept so a language toggle re-renders instead of re-verifying (re-hashing is wasted work,
// and re-fetching the root a second time just to switch labels would be a strange thing for a "never talks to the
// network more than it has to" page to do).
let lastBundle = null;
let lastSteps = null;

function renderIssuer(bundle) {
  const card = $('issuerCard');
  if (!bundle || !bundle.issuerName) { card.style.display = 'none'; return; }
  $('issuerName').textContent = bundle.issuerName;
  card.style.display = 'block';
}

function renderDisplayRows(bundle) {
  const card = $('displayRowsCard');
  const box = $('displayRows');
  box.innerHTML = '';

  const rows = Array.isArray(bundle?.displayRows) ? bundle.displayRows : [];
  if (!rows.length) {
    card.style.display = 'none';
    return;
  }

  for (const r of rows) {
    if (!r || typeof r !== 'object') continue;
    const value = (r.value ?? '').toString();
    if (!value) continue;

    // Prefer the language-specific label; fall back through the other language, then the default, before the
    // generic placeholder — a row sealed before C2's bilingual labels only ever has `label`.
    const label = (lang === 'ar'
        ? (r.labelAr ?? r.labelEn ?? r.label)
        : (r.labelEn ?? r.label ?? r.labelAr)) || t('fieldFallback');

    const row = document.createElement('div');
    row.className = 'kv';

    const k = document.createElement('div');
    k.className = 'k';
    k.textContent = label;

    const v = document.createElement('div');
    v.className = 'v';
    v.textContent = value;

    row.appendChild(k);
    row.appendChild(v);
    box.appendChild(row);
  }

  card.style.display = box.children.length ? 'block' : 'none';
}

function renderSteps(steps) {
  const stepsEl = $('steps');
  stepsEl.innerHTML = '';
  for (const s of steps) {
    const div = document.createElement('div');
    div.className = 'step ' + (s.warn ? 'warn' : s.ok ? 'ok' : 'bad');
    div.innerHTML =
      '<div class="mark">' + (s.warn ? '!' : s.ok ? '✓' : '✕') + '</div>' +
      '<div><div class="t"></div><div class="d"></div>' +
      (s.human ? '<div class="d" style="margin-top:6px"><code></code></div>' : '') +
      '</div>';
    div.querySelector('.t').textContent = t(s.titleKey);
    div.querySelectorAll('.d')[0].textContent = s.detail;
    if (s.human) div.querySelector('code').textContent = s.human;
    stepsEl.appendChild(div);
  }
  $('results').style.display = 'block';
}

function renderVerdict(steps) {
  const verdict = $('verdict');
  const failed = steps.some(s => !s.warn && !s.ok);
  const warned = steps.some(s => s.warn);

  if (failed) {
    verdict.className = 'verdict bad';
    verdict.innerHTML = t('verdictBadTitle') + '<small>' + t('verdictBadDetail') + '</small>';
  } else if (warned) {
    verdict.className = 'verdict warn';
    verdict.style.display = 'block';
    verdict.innerHTML = t('verdictWarnTitle') + '<small>' + t('verdictWarnDetail') + '</small>';
  } else {
    verdict.className = 'verdict ok';
    verdict.innerHTML = t('verdictOkTitle') + '<small>' + t('verdictOkDetail') + '</small>';
  }
}

function renderAll() {
  applyStaticI18n();
  if (!lastSteps) return;
  renderIssuer(lastBundle);
  renderSteps(lastSteps);
  renderDisplayRows(lastBundle);
  renderVerdict(lastSteps);
}

$('langToggle').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-lang]');
  if (!btn || btn.dataset.lang === lang) return;
  lang = btn.dataset.lang;
  renderAll();
});

$('file').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  if (f) $('bundle').value = await f.text();
});

$('go').addEventListener('click', async () => {
  const verdict = $('verdict');
  const results = $('results');
  const displayRowsCard = $('displayRowsCard');
  const issuerCard = $('issuerCard');
  verdict.className = 'verdict';
  results.style.display = 'none';
  displayRowsCard.style.display = 'none';
  issuerCard.style.display = 'none';
  lastBundle = null;
  lastSteps = null;

  let bundle;
  try {
    bundle = JSON.parse($('bundle').value);
  } catch (e) {
    verdict.className = 'verdict bad';
    verdict.innerHTML = t('notJsonTitle') + '<small>' + t('notJsonDetail') + '</small>';
    return;
  }

  const wrongFile = describeIfNotABundle(bundle);
  if (wrongFile) {
    verdict.className = 'verdict warn';
    verdict.style.display = 'block';
    verdict.innerHTML = t('notBundleTitle') + '<small>' + wrongFile + '</small>';
    return;
  }

  let steps;
  try {
    steps = await verify(bundle);
  } catch (e) {
    verdict.className = 'verdict bad';
    verdict.innerHTML = t('couldNotVerifyTitle') + '<small>' + e.message + '</small>';
    return;
  }

  lastBundle = bundle;
  lastSteps = steps;
  renderIssuer(bundle);
  renderSteps(steps);
  renderDisplayRows(bundle);
  renderVerdict(steps);
});

applyStaticI18n();
</script>
</div>
</body>
</html>
